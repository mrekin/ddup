# Health Check and DNS Update Configuration

# How often to perform health checks
interval: 30s

# List of domains to manage
domains:
  - recordName: "service.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "2s"
      attempts: 3
      # Consecutive successes needed to re-add an endpoint that was removed (default 1)
      recoverAfter: 3
      # Request method: GET (default) or HEAD
      method: "HEAD"
      # Status code that means healthy: an exact code or "2xx" (default "2xx")
      expectStatus: "204"
    endpoints:
      - name: "server1"
        url: "http://192.168.1.100:8080/health"
        ip: "192.168.1.100"
      # IPv6 endpoints are published as AAAA records
      - name: "server2-ipv6"
        url: "http://[2001:db8::101]:8080/health"
        ip: "2001:db8::101"
  - recordName: "foo.example.com"
    provider: "example-provider-1"
    ttl: 120
    healthChecks:
      timeout: "5s"
      attempts: 2
    endpoints:
      - name: "foo1"
        url: "http://192.168.1.200:9000/health"
        ip: "192.168.1.200"
      - name: "foo2"
        url: "http://192.168.1.201:9000/health"
        ip: "192.168.1.201"
  - recordName: "app.example.com"
    provider: "example-provider-1"
    ttl: 120
    endpoints:
      # Endpoints have priority 0 by default, and lower values are preferred
      # DNS only contains the healthy endpoints with the lowest priority value
      - name: "primary"
        url: "http://192.168.1.50:8080/health"
        ip: "192.168.1.50"
      # Backup, published only while "primary" is unhealthy
      - name: "backup"
        url: "http://203.0.113.10:8080/health"
        ip: "203.0.113.10"
        priority: 1

# Provider Configuration
providers:
  example-provider-1:
    cloudflare:
      apiToken: "your-cloudflare-api-token"
      zoneId: "your-zone-id"

# Push notifications (optional)
# Sends a notification to an ntfy server (like https://ntfy.sh) when endpoints go down or
# recover, and when DNS records are updated or an update fails.
# Disabled unless a topic is set. On a public server the topic name acts as a password:
# pick a hard-to-guess one. To test it: curl -d "test" https://ntfy.sh/<your-topic>
notifications:
  # ntfy server (defaults to https://ntfy.sh)
  # server: "https://ntfy.sh"
  # Topic to publish notifications to; required to enable notifications
  topic: "ddup-notifications-2f8a1c"
  # Optional ntfy access token (tk_...) to publish to a protected topic
  # token: "tk_xxxxxxxxxxxxxxxxxxxx"
  # Timeout for publishing each notification (defaults to 10s)
  # timeout: "10s"

# Enable the web server
server:
  enabled: true
  bind: "127.0.0.1"
  port: 7401
  # Optional base path under which the web dashboard and the API are served.
  # For example, with basePath "ddup", the dashboard is available at "/ddup/" and the API at "/ddup/api/...".
  # When empty, everything is served from the root "/"
  # basePath: "ddup"
